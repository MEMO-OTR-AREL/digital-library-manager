<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="auth-split-wrapper">

    <div class="auth-left-panel">

        <div class="auth-illustration-logo">
            <div class="logo-blue"></div>
            <div class="logo-green"></div>
        </div>

        <h1>Neh-Meh Library</h1>

        <p>
            Manage your books, reading progress
            and favorite books.
        </p>

    </div>

    <div class="auth-right-panel">

        <div class="auth-form-box">

            <h2>Welcome Back</h2>

            <p class="auth-form-subtitle">
                Login to your digital library.
            </p>

            {% if error %}
                <div class="error-message">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">

                <label>Username</label>
                <input
                    class="auth-input"
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >

                <label>Password</label>
                <input
                    class="auth-input"
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="/register">Register</a>
            </p>

        </div>

    </div>

</div>

</body>
</html>

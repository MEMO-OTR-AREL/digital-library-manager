```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Edit Book</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="dashboard-wrapper">

    <!-- NAVBAR -->

    <div class="dashboard-navbar">

        <div class="dashboard-logo">

            <div class="mini-logo">

                <div class="mini-blue"></div>

                <div class="mini-green"></div>

            </div>

            <div class="dashboard-logo-text">

                <h2>Neh-Meh Library</h2>

                <p>DIGITAL LIBRARY</p>

            </div>

        </div>

        <div class="dashboard-links">

            <a href="/dashboard">Dashboard</a>

            <a href="/add_book">Add Book</a>

            <a href="/books">My Books</a>

            <a href="/logout">Logout</a>

        </div>

    </div>

    <!-- PAGE -->

    <div class="addbook-container">

        <div class="addbook-header">

            <h1>
                Edit Book
            </h1>

            <p>
                Update book details and
                manage your reading progress.
            </p>

        </div>

        <div class="addbook-card">

            <form method="POST">

                <!-- AUTO FILL -->

                <script>

                const booksData = {

                    "Suç ve Ceza": {
                        author: "Dostoyevski",
                        category: "Classic",
                        rating: "10"
                    },

                    "Kumarbaz": {
                        author: "Dostoyevski",
                        category: "Classic",
                        rating: "8"
                    },

                    "Sefiller": {
                        author: "Victor Hugo",
                        category: "Classic",
                        rating: "9"
                    },

                    "Harry Potter": {
                        author: "J.K Rowling",
                        category: "Fantasy",
                        rating: "9"
                    },

                    "Hobbit": {
                        author: "J.R.R Tolkien",
                        category: "Fantasy",
                        rating: "9"
                    },

                    "Dune": {
                        author: "Frank Herbert",
                        category: "Science Fiction",
                        rating: "8"
                    },

                    "Atomic Habits": {
                        author: "James Clear",
                        category: "Self Improvement",
                        rating: "9"
                    },

                    "Clean Code": {
                        author: "Robert C. Martin",
                        category: "Programming",
                        rating: "10"
                    }

                };

                function fillBookData() {

                    const title =
                        document.getElementById("title").value;

                    if (booksData[title]) {

                        document.getElementById("author").value =
                            booksData[title].author;

                        document.getElementById("category").value =
                            booksData[title].category;

                        document.getElementById("rating").value =
                            booksData[title].rating;

                        document.getElementById("hidden-author").value =
                            booksData[title].author;

                        document.getElementById("hidden-category").value =
                            booksData[title].category;

                        document.getElementById("hidden-rating").value =
                            booksData[title].rating;
                    }
                }

                </script>

                <div class="form-grid">

                    <!-- TITLE -->

                    <select
                        name="title"
                        id="title"
                        class="auth-input"
                        onchange="fillBookData()"
                    >

                        <option value="Suç ve Ceza"
                            {% if book[2] == "Suç ve Ceza" %}
                                selected
                            {% endif %}
                        >
                            Suç ve Ceza
                        </option>

                        <option value="Kumarbaz"
                            {% if book[2] == "Kumarbaz" %}
                                selected
                            {% endif %}
                        >
                            Kumarbaz
                        </option>

                        <option value="Sefiller"
                            {% if book[2] == "Sefiller" %}
                                selected
                            {% endif %}
                        >
                            Sefiller
                        </option>

                        <option value="Harry Potter"
                            {% if book[2] == "Harry Potter" %}
                                selected
                            {% endif %}
                        >
                            Harry Potter
                        </option>

                        <option value="Hobbit"
                            {% if book[2] == "Hobbit" %}
                                selected
                            {% endif %}
                        >
                            Hobbit
                        </option>

                        <option value="Dune"
                            {% if book[2] == "Dune" %}
                                selected
                            {% endif %}
                        >
                            Dune
                        </option>

                    </select>

                    <!-- AUTHOR -->

                    <select
                        id="author"
                        class="auth-input"
                        disabled
                    >

                        <option selected>
                            {{ book[3] }}
                        </option>

                    </select>

                    <input
                        type="hidden"
                        name="author"
                        id="hidden-author"
                        value="{{ book[3] }}"
                    >

                    <!-- CATEGORY -->

                    <select
                        id="category"
                        class="auth-input"
                        disabled
                    >

                        <option selected>
                            {{ book[4] }}
                        </option>

                    </select>

                    <input
                        type="hidden"
                        name="category"
                        id="hidden-category"
                        value="{{ book[4] }}"
                    >

                    <!-- STATUS -->

                    <select
                        name="status"
                        class="auth-input"
                    >

                        <option value="Reading"
                            {% if book[5] == "Reading" %}
                                selected
                            {% endif %}
                        >
                            Reading
                        </option>

                        <option value="Completed"
                            {% if book[5] == "Completed" %}
                                selected
                            {% endif %}
                        >
                            Completed
                        </option>

                        <option value="Planned"
                            {% if book[5] == "Planned" %}
                                selected
                            {% endif %}
                        >
                            Planned
                        </option>

                    </select>

                    <!-- RATING -->

                    <select
                        id="rating"
                        class="auth-input"
                        disabled
                    >

                        <option selected>
                            {{ book[6] }}
                        </option>

                    </select>

                    <input
                        type="hidden"
                        name="rating"
                        id="hidden-rating"
                        value="{{ book[6] }}"
                    >

                    <!-- PROGRESS -->

                    <select
                        name="progress"
                        class="auth-input"
                    >

                        <option value="0">0%</option>
                        <option value="10">10%</option>
                        <option value="20">20%</option>
                        <option value="30">30%</option>
                        <option value="40">40%</option>
                        <option value="50">50%</option>
                        <option value="60">60%</option>
                        <option value="70">70%</option>
                        <option value="80">80%</option>
                        <option value="90">90%</option>
                        <option value="100">100%</option>

                    </select>

                </div>

                <button
                    type="submit"
                    class="big-add-btn"
                >
                    Update Book
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
```

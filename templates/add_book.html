<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Add Book</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="dashboard-wrapper">

    <div class="dashboard-navbar">

        <div class="dashboard-logo">

            <div class="mini-logo">
                <div class="mini-blue"></div>
                <div class="mini-green"></div>
            </div>

            <div class="dashboard-logo-text">
                <h2>Neh-Meh Library</h2>
                <p>DIGITAL LIBRARY</p>
            </div>

        </div>

        <div class="dashboard-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/add_book">Add Book</a>
            <a href="/books">My Books</a>
            <a href="/logout">Logout</a>
        </div>

    </div>

    <div class="addbook-container">

        <div class="addbook-header">

            <h1>Add New Book</h1>

            <p>
                Add a new book to your digital library
                and track your reading progress.
            </p>

        </div>

        <div class="addbook-card">

            <form method="POST">

                <script>
                    const booksData = {
                        "Crime and Punishment": {
                            author: "Fyodor Dostoevsky",
                            category: "Classic",
                            rating: "10"
                        },
                        "The Gambler": {
                            author: "Fyodor Dostoevsky",
                            category: "Classic",
                            rating: "8"
                        },
                        "Les Miserables": {
                            author: "Victor Hugo",
                            category: "Classic",
                            rating: "9"
                        },
                        "Harry Potter": {
                            author: "J.K. Rowling",
                            category: "Fantasy",
                            rating: "9"
                        },
                        "The Hobbit": {
                            author: "J.R.R. Tolkien",
                            category: "Fantasy",
                            rating: "9"
                        },
                        "Dune": {
                            author: "Frank Herbert",
                            category: "Science Fiction",
                            rating: "8"
                        },
                        "Atomic Habits": {
                            author: "James Clear",
                            category: "Psychology",
                            rating: "9"
                        },
                        "Thinking, Fast and Slow": {
                            author: "Daniel Kahneman",
                            category: "Psychology",
                            rating: "10"
                        },
                        "Clean Code": {
                            author: "Robert C. Martin",
                            category: "Programming",
                            rating: "10"
                        },
                        "Python Crash Course": {
                            author: "Eric Matthes",
                            category: "Programming",
                            rating: "9"
                        }
                    };

                    function fillBookData() {
                        const title = document.getElementById("title").value;

                        if (!booksData[title]) {
                            document.getElementById("author").value = "";
                            document.getElementById("category").value = "";
                            document.getElementById("rating").value = "";
                            return;
                        }

                        document.getElementById("author").value =
                            booksData[title].author;

                        document.getElementById("category").value =
                            booksData[title].category;

                        document.getElementById("rating").value =
                            booksData[title].rating;
                    }
                </script>

                <div class="form-grid">

                    <select
                        name="title"
                        id="title"
                        class="auth-input"
                        onchange="fillBookData()"
                        required
                    >
                        <option value="">Select Book</option>
                        <option value="Crime and Punishment">Crime and Punishment</option>
                        <option value="The Gambler">The Gambler</option>
                        <option value="Les Miserables">Les Miserables</option>
                        <option value="Harry Potter">Harry Potter</option>
                        <option value="The Hobbit">The Hobbit</option>
                        <option value="Dune">Dune</option>
                        <option value="Atomic Habits">Atomic Habits</option>
                        <option value="Thinking, Fast and Slow">Thinking, Fast and Slow</option>
                        <option value="Clean Code">Clean Code</option>
                        <option value="Python Crash Course">Python Crash Course</option>
                    </select>

                    <input
                        type="text"
                        id="author"
                        class="auth-input"
                        placeholder="Author"
                        readonly
                    >

                    <input
                        type="text"
                        id="category"
                        class="auth-input"
                        placeholder="Category"
                        readonly
                    >

                    <select
                        name="status"
                        class="auth-input"
                        required
                    >
                        <option value="">Select Status</option>
                        <option value="Reading">Reading</option>
                        <option value="Completed">Completed</option>
                        <option value="Planned">Planned</option>
                    </select>

                    <input
                        type="text"
                        id="rating"
                        class="auth-input"
                        placeholder="Rating"
                        readonly
                    >

                    <select
                        name="progress"
                        class="auth-input"
                        required
                    >
                        <option value="">Select Progress</option>
                        <option value="0">0%</option>
                        <option value="10">10%</option>
                        <option value="20">20%</option>
                        <option value="30">30%</option>
                        <option value="40">40%</option>
                        <option value="50">50%</option>
                        <option value="60">60%</option>
                        <option value="70">70%</option>
                        <option value="80">80%</option>
                        <option value="90">90%</option>
                        <option value="100">100%</option>
                    </select>

                </div>

                <button
                    type="submit"
                    class="big-add-btn"
                >
                    Add Book
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
